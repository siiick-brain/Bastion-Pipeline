version: 2
# 7-day cooldown against compromised fresh releases. Security updates are not delayed.
updates:
  - package-ecosystem: pip
    directories: ["/app", "/update-signing"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/update-signing", "/infra/jenkins"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Dockerfile.naive is a fixed baseline (docs/hardening.md).
    ignore:
      - dependency-name: "python"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
