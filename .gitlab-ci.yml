# GitLab CI: the source stages of docs/pipeline-contract.md. Every image is pinned by digest.
# GitHub Actions remains the single release authority (container, signing, provenance).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [policy, lint, test, security, sbom]

default:
  interruptible: true
  timeout: 20m

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "0"
  PYTHON_IMAGE: python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df

.python:
  image: $PYTHON_IMAGE
  before_script:
    - 'python -m pip install --require-hashes --no-deps --only-binary :all: -r app/requirements-dev.txt'

policy:
  stage: policy
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
  script:
    - base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA}}"
    - if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
    - bash scripts/check-authorship.sh "${base}..HEAD"

lint:
  stage: lint
  extends: .python
  script:
    - python -m ruff check .
    - python -m ruff format --check .
    - python -m mypy app scripts/oidc scripts/release update-signing/bastion_update firmware-sim/boot_sim.py
    - python -m yamllint --strict .

test:
  stage: test
  extends: .python
  # The commit policy tests need git; the slim image has none.
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - 'python -m pip install --require-hashes --no-deps --only-binary :all: -r app/requirements-dev.txt'
  script:
    - python -m pytest --cov --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=85 --junitxml=junit.xml
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

semgrep:
  stage: security
  image: semgrep/semgrep@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
  script:
    # Without this the image expects the code mounted at /src.
    - env -u SEMGREP_IN_DOCKER semgrep scan --config p/python --config p/dockerfile --config p/secrets --metrics=off --error --severity ERROR

gitleaks:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script:
    - gitleaks git . --log-opts=HEAD --redact --no-banner --exit-code 1

osv:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner@sha256:f7ba4be68bac8086b1f88fd598fdca1ca67239c79ad2c2b5c78e03a82e5187c4
    entrypoint: [""]
  script:
    # The binary is the image entrypoint, not on PATH.
    - /osv-scanner scan source --config osv-scanner.toml -L app/requirements.txt -L app/requirements-dev.txt -L update-signing/requirements.txt

trivy:
  stage: security
  image:
    name: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  script:
    - trivy fs --scanners misconfig,secret --severity CRITICAL,HIGH --exit-code 1 --ignorefile .trivyignore.yaml .

sbom:
  stage: sbom
  image:
    # v1.55.0-debug: same Syft with a shell, which GitLab jobs need.
    name: anchore/syft@sha256:b70ccf4e8b5d95653b4564a4beea3518ccab8017250971a799ba1fab13a276d6
    entrypoint: [""]
  script:
    - /syft dir:. -o cyclonedx-json@1.6=sbom-source.cdx.json -o spdx-json=sbom-source.spdx.json
  artifacts:
    paths: [sbom-source.cdx.json, sbom-source.spdx.json]
    expire_in: 30 days
