# Local run of the hardened image with the same restrictions as the Kubernetes pod.
# The port binds to 127.0.0.1 only. Used by the ZAP jobs and for local testing.
name: bastion
services:
  app:
    build: .
    image: bastion-pipeline:local
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"
    mem_limit: 256m
    pids_limit: 128
    ports:
      - "127.0.0.1:${BASTION_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/usr/bin/python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [scan]
networks:
  scan:
    name: bastion-scan
