apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bastion-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/siiick-brain/Bastion-Pipeline.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bastion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
