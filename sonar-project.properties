# SonarCloud analysis, run by the sonarcloud job in .github/workflows/security.yml.
# SonarCloud analyses the whole project and detects tests itself.
sonar.organization=siiick-brain
sonar.projectKey=siiick-brain_Bastion-Pipeline

sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml
# Coverage is imported for Python only. Excluded from the coverage figure:
# - the PKCS#11 modules, same as [tool.coverage.run] in pyproject.toml (tested in the
#   update-signing container job);
# - PowerShell, verified by Pester and PSScriptAnalyzer in windows.yml;
# - the local Jenkins driver, exercised by the Jenkins build.
sonar.coverage.exclusions=update-signing/bastion_update/pkcs11_signer.py,update-signing/build_update.py,\
  **/*.ps1,**/*.psm1,**/*.psd1,infra/jenkins/run_job.py
# Dockerfile.naive is the deliberately insecure baseline for docs/hardening.md (EX-001).
sonar.exclusions=Dockerfile.naive,Dockerfile.naive.dockerignore

# The Jenkins SSH agent starts sshd as root to drop privileges per session (EX-004 in
# security/exceptions.toml).
sonar.issue.ignore.multicriteria=agentroot,clipaths1,clipaths2,tagdigest
sonar.issue.ignore.multicriteria.agentroot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.agentroot.resourceKey=infra/jenkins/Dockerfile.agent

# Path traversal via command-line arguments: these are operator CLI tools. The person who runs
# them chooses the file and can already read it, so no privilege boundary is crossed.
sonar.issue.ignore.multicriteria.clipaths1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.clipaths1.resourceKey=scripts/**/*.py
sonar.issue.ignore.multicriteria.clipaths2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.clipaths2.resourceKey=update-signing/*.py
sonar.sourceEncoding=UTF-8

# Base images are pinned as tag@digest on purpose: the digest makes the build reproducible and
# the tag is what Dependabot follows to propose the next digest.
sonar.issue.ignore.multicriteria.tagdigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.tagdigest.resourceKey=**/Dockerfile*
